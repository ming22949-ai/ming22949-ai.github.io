<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P011.html</title>
<style>
body {
    margin: 0;
    background: #f5f5f5;
    font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    display: flex;
    justify-content: center;
}
.app {
    width: 390px;
    min-height: 100vh;
    background: white;
    padding: 20px;
    box-sizing: border-box;
}
.main-box {
    border: 2px solid #999;
    height: 720px;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}
/* 上部ヘッダーエリア */
.header-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    height: 60px;
}
.level-title {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    max-width: 220px;
    word-wrap: break-word;
}
.fanhui-btn {
    width: 80px;
    height: 50px;
    border: 2px solid #333;
    background: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.2;
}
/* 中央問題文エリア */
.question-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 24px; /* 問題の文字（漢字・読み）を大きく見やすく */
    font-weight: bold;
    color: #333;
    padding: 10px;
    line-height: 1.5;
    word-break: break-all;
}
/* 下部選択肢・判定エリア */
.bottom-container {
    margin-bottom: 20px;
}
.choice-btn {
    width: 100%;
    height: 45px;
    border: 2px solid #666;
    background: white;
    font-size: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    text-align: center;
    border-radius: 4px;
}
.choice-btn:hover {
    background: #f0f0f0;
}
/* 結果表示エリア（正解ポター / 間違いポター） */
.result-panel {
    width: 100%;
    height: 45px;
    border: 2px solid #333;
    background: #eef7ff;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 4px;
    visibility: hidden; /* 初期状態は非表示 */
}
/* 正解・間違い時の動的色変更 */
.result-correct {
    background-color: #d4edda !important;
    color: #155724 !important;
    border-color: #c3e6cb !important;
}
.result-wrong {
    background-color: #f8d7da !important;
    color: #721c24 !important;
    border-color: #f5c6cb !important;
}
</style>
</head>
<body>

<div class="app">
  <div class="main-box">
    
    <div class="header-area">
      <div id="levelTitle" class="level-title">読み込み中...</div>
      <button id="fanhuiBtn" class="fanhui-btn">
        <span>FAN</span>
        <span>HUI</span>
      </button>
    </div>
    
    <div id="questionText" class="question-area">
      データを読み込んでいます...
    </div>
    
    <div class="bottom-container">
      <button id="choice1" class="choice-btn">-</button>
      <button id="choice2" class="choice-btn">-</button>
      <button id="choice3" class="choice-btn">-</button>
      <button id="choice4" class="choice-btn">-</button>
      
      <div id="resultPanel" class="result-panel">結果</div>
    </div>

  </div>
</div>

<script src="P011.js"></script>
</body>
</html>

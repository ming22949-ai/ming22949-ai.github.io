<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P010.html</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:"Yu Gothic","Hiragino Sans",sans-serif;
    display:flex;
    justify-content:center;
}

.app{
    width:390px;
    min-height:100vh;
    background:white;
    padding:20px;
    box-sizing:border-box;
}

.main-box{
    border:2px solid #999;
    height:720px;
    position:relative;
    padding:20px;
    box-sizing:border-box;
}

/* 下部ボタン */
.bottom-area{
    position:absolute;
    bottom:30px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.nav-btn{
    width:120px;
    height:50px;
    border:2px solid #999;
    background:white;
    font-size:24px;
    color:#555;
    cursor: pointer;
}

/* 非表示制御用の共通スタイル */
.hidden {
    visibility: hidden;
    /* レイアウトを崩さずにボタンだけ隠す場合は visibility: hidden を使用します */
}

.page{
    font-size:28px;
    color:#333;
}

/* 既存のステージ数表示・装飾ボタンスタイル */
.stem-btn {
    width: 50px;
    height: 50px;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid #555;
    background: white;
    border-radius: 50%;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <div class="main-box">
    <table width="90%" height="109" border="0" align="center">
        <tbody>
          <tr>
            <td width="50%" height="64" valign="middle" style="font-size:24px; font-weight:bold;">IT日本語 N2</td>
            <td width="50%" align="right">
              <!-- 【5】もどるボタン -->
              <button id="backBtn" class="nav-btn">戻る</button>
            </td>
          </tr>
        </tbody>
      </table>
      
      <!-- ステージ表示エリア (上から7→1の順に並ぶ構造) -->
      <table width="90%" height="460" border="0" align="center">
        <tbody>
            <tr>
              <td width="50%" align="right"><button id="btn7" class="stem-btn">7</button></td>
              <td width="50%">&nbsp;</td>
            </tr>
            <tr>
              <td>&nbsp;</td>
              <td align="center" valign="middle"><button id="btn6" class="stem-btn">6</button></td>
            </tr>
            <tr>
              <td align="center"><button id="btn5" class="stem-btn">5</button></td>
              <td>&nbsp;</td>
            </tr>
            <tr>
              <td>&nbsp;</td>
              <td align="center"><button id="btn4" class="stem-btn">4</button> </td>
            </tr>
            <tr>
              <td align="center"><button id="btn3" class="stem-btn">3</button></td>
              <td>&nbsp;</td>
            </tr>
            <tr>
              <td>&nbsp;</td>
              <td align="center"><button id="btn2" class="stem-btn">2</button>  </td>
            </tr>
            <tr>
              <td height="84" align="right"><button id="btn1" class="stem-btn">1</button></td>
              <td></td>
            </tr>
        </tbody>
      </table>
  
      <!-- 下部ページングエリア -->
      <div class="bottom-area">
          <!-- 【4, 7, 9】前へボタン -->
          <button id="prevBtn" class="nav-btn">前へ</button>

          <!-- ページ番号表示エリア -->
          <div id="pageDisplay" class="page">1 / 1</div>

          <!-- 【3, 6, 8】次へボタン -->
          <button id="nextBtn" class="nav-btn">次へ</button>
      </div>

  </div>
</div>

<!-- ロジックの読み込み -->
<script src="P010.js"></script>
</body>
</html>
